name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # 只装核心依赖 + mcp + dev：单测用 FakeEngine，不需要 torch（CI 机器无 GPU）
      - run: uv sync --frozen --extra mcp --group dev
      - run: uv run ruff check server tests
      - run: uv run ruff format --check server tests
      - run: uv run pytest -q tests/unit tests/regression --junitxml=pytest.xml
      - name: e2e (skipped without DSOCR_BASE — reported, not passed)
        run: uv run pytest -q tests/e2e -rs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report
          path: pytest.xml

  frontend:
    name: frontend (lint + types + unit + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npx vue-tsc -b
      - run: npx vitest run
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: frontend e2e (chromium, mocked API)
    runs-on: ubuntu-latest
    needs: frontend
    # 与 GitLab CI、视觉快照基线同一个镜像：ubuntu-latest 上 `playwright install --with-deps` 的系统字体不同，
    # 快照 S2 差 6%（54216 像素）而红（2026-11-07），GitLab 在该镜像里全绿
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright test --project=chromium --reporter=line
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  docker-build:
    name: docker build (hf target, no push)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: hf
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
